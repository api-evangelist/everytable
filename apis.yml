apis:
- name: Everytable Agentic Commerce API (UCP over MCP)
  description: 'Everytable''s Shopify storefront implements the Universal Commerce
    Protocol (UCP) and exposes it to agents as a Model Context Protocol (MCP) endpoint
    at https://everytable.com/api/ucp/mcp. The store advertises the endpoint in its
    own /robots.txt, /llms.txt and /agents.md, and describes its capabilities at /.well-known/ucp.
    Declared capabilities cover catalog search and lookup, cart, checkout, fulfillment,
    discount and order, with Shop Pay, Shopify card and Google Pay payment handlers.
    Payment completion requires contemporaneous human approval.'
  humanURL: https://everytable.com/agents.md
  baseURL: https://everytable.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - UCP
  - E-Commerce
  tags_raw:
  - MCP
  - Agentic Commerce
  - UCP
  - Ecommerce
  properties:
  - type: MCPServer
    url: mcp/everytable-mcp.yml
  - type: Documentation
    url: https://everytable.com/agents.md
- name: Everytable Storefront Catalog (JSON)
  description: 'Read-only product and collection JSON surfaced by the Everytable Shopify
    storefront and documented by Everytable in its own /llms.txt: product JSON at /products/{handle}.json,
    collection product JSON at /collections/{handle}/products.json, and product search
    at /search?q={query}&type=product. No authentication is required for these read
    paths; Everytable directs transacting agents to the UCP/MCP endpoint instead.'
  humanURL: https://everytable.com/llms.txt
  baseURL: https://everytable.com
  tags:
  - Catalog
  - Product
  - E-Commerce
  tags_raw:
  - Catalog
  - Products
  - Ecommerce
  properties:
  - type: LLMsTxt
    url: llms/everytable-llms.txt
- name: Everytable Customer Account (OAuth 2.0 / OpenID Connect)
  description: 'Shopify Customer Accounts authorization server for Everytable, discoverable
    anonymously at https://everytable.com/.well-known/openid-configuration and /.well-known/oauth-authorization-server.
    Issuer https://shopify.com/authentication/69951324217, authorization and token
    endpoints on account.everytable.com, authorization_code + refresh_token + jwt-bearer
    grants, PKCE S256 required, RS256 ID tokens, and four published scopes including
    customer-account-mcp-api:full.'
  humanURL: https://everytable.com/.well-known/openid-configuration
  baseURL: https://account.everytable.com
  tags:
  - Authentication
  - OpenID Connect
  tags_raw:
  - OAuth
  - OpenID Connect
  - Authentication
  properties:
  - type: Authentication
    url: authentication/everytable-authentication.yml
  - type: OAuthScopes
    url: scopes/everytable-scopes.yml
