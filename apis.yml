aid: everytable
name: Everytable
description: 'Everytable is a Los Angeles-based food company and social enterprise
  founded in 2015 by Sam Polk that sells scratch-cooked, ready-to-eat meals — bowls,
  salads, wraps, sandwiches, soups, kids meals and breakfast — through grab-and-go
  storefronts across Southern California and New York City, a home meal-delivery subscription,
  and food-service programs for workplaces (Everytable@WORK) and K-12 schools. Its
  variable-pricing model sets meal prices against the income level of each neighborhood
  it serves. Everytable runs no traditional developer program; its machine-readable
  surface is its Shopify storefront, which publishes agent-facing instructions at /agents.md
  and /llms.txt and implements the Universal Commerce Protocol (UCP) over an MCP endpoint
  for agent-driven catalog search, cart, and buyer-approved checkout, backed by Shopify
  Customer Account OAuth 2.0 / OpenID Connect.'
